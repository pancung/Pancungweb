<!doctype html>
<html lang="cs">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#1C2418" />
        <meta name="description" content="Pan Čung – finanční poradce pro vietnamské rodiny a podnikatele v Česku. Rezerva, hypotéka, investice a ochrana rodiny, vietnamsky i česky." />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet" />
        <!--
        manifest.json provides metadata used when your web app is installed on a
        user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
        -->
        <!--
        Notice the use of %PUBLIC_URL% in the tags above.
        It will be replaced with the URL of the `public` folder during the build.
        Only files inside the `public` folder can be referenced from the HTML.

        Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
        work correctly both with client-side routing and a non-root public URL.
        Learn how to configure a non-root public URL by running `npm run build`.
        -->
        <title>Tài Chính An Tâm | Životní pojištění pro vietnamské rodiny</title>
        <script>window.addEventListener("error",function(e){if(e.error instanceof DOMException&&e.error.name==="DataCloneError"&&e.message&&e.message.includes("PerformanceServerTiming")){e.stopImmediatePropagation();e.preventDefault()}},true);</script>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
        <!-- Netlify Forms: static twin of the React lead form, so Netlify registers "lead" at deploy time -->
        <form name="lead" data-netlify="true" netlify-honeypot="bot-field" hidden>
            <input type="text" name="name" /><input type="tel" name="phone" /><input type="email" name="email" />
            <input type="text" name="channel" /><input type="text" name="topic" /><input type="text" name="lang" />
            <input type="text" name="summary" /><input type="text" name="consent" /><input type="text" name="bot-field" />
        </form>

      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
    </body>
</html>
